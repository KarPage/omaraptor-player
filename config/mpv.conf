# ~/.config/omaraptor/mpv.conf  (used only by omaraptor; your normal mpv config is untouched)

# Frameless: no title bar, no decorations, nothing but the picture.
border=no
# X11/XWayland only; on Hyprland the window rule's "pin" does the always-on-top job.
ontop=yes
# Window follows the video's shape; Hyprland keep_aspect_ratio holds it while you drag.
keepaspect-window=yes
# Plain left-drag on the video moves the window (SUPER+drag also works).
window-dragging=yes
# ...but the drag itself is started by omaraptor-hud.lua (after 5 px of movement), so a plain
# click can play/pause without a drag ever pausing.
input-builtin-dragging=no
# Edge/corner resize zone inside the frameless window (physical px; mpv default 16 = 12 px at
# 1.33x scale, so the corners were a 12x12 px target and a press just inside it moved the window).
# 24 = 18 px at 1.33x. Hyprland's own 15 px zone outside the edge (resize_on_border) still works too.
wayland-edge-pixels-pointer=24
# A click waits this long (ms) before toggling pause, so a double-click only goes fullscreen.
input-doubleclick-time=250
# Start at 30% of the screen if no window rule sizes it (non-Hyprland fallback).
autofit=30%

# Controls: the small hover square from scripts/omaraptor-hud.lua (loaded from this config
# dir's scripts/ folder). The stock mpv controller stays hidden; Tab still brings it up.
osc=yes
script-opts-append=osc-visibility=never
load-scripts=yes
osd-level=1
osd-duration=900
osd-bar=yes
osd-font-size=28
# Status text (Paused, Muted, titles) at the top centre, clear of the HUD's corner + and ? buttons.
osd-align-x=center
cursor-autohide=800
title=OmaRaptor Player - ${media-title}

# Quality cap: up to 1080p60 (plenty for a corner window), hardware decoding for battery.
ytdl-format=bv*[height<=1080][fps<=60]+ba/b[height<=1080]/b
hwdec=auto-safe
profile=fast

# Behaviour
# Precise seeks: +/-10 s lands on the second, not the next keyframe.
hr-seek=yes
keep-open=no
save-position-on-quit=no
volume=80
cache=yes
demuxer-max-bytes=150MiB
demuxer-readahead-secs=30
# Playlist links (list=...) play through the whole list; single videos continue with
# YouTube's "up next" mix (scripts/omaraptor-autoplay.lua), like autoplay on youtube.com.
ytdl-raw-options-append=yes-playlist=

# Optional: use your YouTube login (age-gated / members-only videos). Off by default.
# ytdl-raw-options-append=cookies-from-browser=chromium
