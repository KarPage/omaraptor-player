# ~/.config/omaraptor/input.conf  (omaraptor only). Keys work when the player has focus.
# Every playback key also flashes the bottom control bar (omaraptor-hud.lua) and dismisses the
# first-launch key card. "?" opens the full keyboard panel.
SPACE         cycle pause; script-message omaraptor-hud flash
k             cycle pause; script-message omaraptor-hud flash
MBTN_RIGHT    cycle pause; script-message omaraptor-hud flash
LEFT          seek -5; script-message omaraptor-hud flash -5s
RIGHT         seek 5; script-message omaraptor-hud flash +5s
j             seek -10; script-message omaraptor-hud flash -10s
l             seek 10; script-message omaraptor-hud flash +10s
0             seek 0 absolute-percent; script-message omaraptor-hud flash 0%
1             seek 10 absolute-percent; script-message omaraptor-hud flash 10%
2             seek 20 absolute-percent; script-message omaraptor-hud flash 20%
3             seek 30 absolute-percent; script-message omaraptor-hud flash 30%
4             seek 40 absolute-percent; script-message omaraptor-hud flash 40%
5             seek 50 absolute-percent; script-message omaraptor-hud flash 50%
6             seek 60 absolute-percent; script-message omaraptor-hud flash 60%
7             seek 70 absolute-percent; script-message omaraptor-hud flash 70%
8             seek 80 absolute-percent; script-message omaraptor-hud flash 80%
9             seek 90 absolute-percent; script-message omaraptor-hud flash 90%
<             script-message omaraptor-hud key spd-
>             script-message omaraptor-hud key spd+
m             cycle mute; script-message omaraptor-hud flash
UP            add volume 5; script-message omaraptor-hud flash
DOWN          add volume -5; script-message omaraptor-hud flash
WHEEL_UP      add volume 5; script-message omaraptor-hud flash
WHEEL_DOWN    add volume -5; script-message omaraptor-hud flash
n             script-message omaraptor-autoplay next; script-message omaraptor-hud flash
N             playlist-prev; script-message omaraptor-hud flash
r             script-message omaraptor-hud key loop
i             script-message omaraptor-hud key link
o             script-message omaraptor-hud key new
# Window size (keeps 16:9, stays anchored to its nearest screen corner)
Ctrl+WHEEL_UP   script-message omaraptor-hud resize larger
Ctrl+WHEEL_DOWN script-message omaraptor-hud resize smaller
=             script-message omaraptor-hud resize larger
+             script-message omaraptor-hud resize larger
-             script-message omaraptor-hud resize smaller
s             script-message omaraptor-hud resize cycle
# MBTN_LEFT (click = play/pause, drag = move) and MBTN_LEFT_DBL (fullscreen) live in omaraptor-hud.lua
# omaraptor-hud.lua also binds: ? keyboard panel, p pin, h / H arm panel (CRUISE <-> COMBAT)
f             cycle fullscreen; script-message omaraptor-hud card-off
ESC           set fullscreen no; script-message omaraptor-hud card-off
TAB           script-message osc-visibility cycle; script-message omaraptor-hud card-off
c             cycle sub; script-message omaraptor-hud card-off
q             quit
