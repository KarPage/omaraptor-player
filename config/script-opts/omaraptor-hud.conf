# ~/.config/omaraptor/script-opts/omaraptor-hud.conf  (bottom control bar)
# seconds without mouse movement before it fades out (while playing; it stays up when paused)
timeout=7
# RRGGBB accent (jade)
accent=2EE6A6
# overall scale of the bar
size=1.0
# PIN: yes = start pinned on every workspace, with the frame and bar kept up.
# The window rule opens unpinned. p / the PIN tile toggles it for this player.
pin=no
# NIGHT: off | dim | dimmer. Warm tint and a softer picture. n / the NIGHT tile cycle it.
# The last level is written back here.
night=off
