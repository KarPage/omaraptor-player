# ~/.config/omaraptor/script-opts/omaraptor-hud.conf  (bottom control bar)
# seconds without mouse movement before it fades out (while playing; it stays up when paused)
timeout=7
# RRGGBB accent (jade)
accent=2EE6A6
# overall scale of the bar
size=1.0
# PIN: yes = the frame + control bar never auto-hide (a "living frame"); p / the PIN tile toggles it per session
pin=no
