name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Lua and jq
        run: sudo apt-get update && sudo apt-get install -y lua5.1 jq

      - name: Run checks
        run: tests/run.sh
